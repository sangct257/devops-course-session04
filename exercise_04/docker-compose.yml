services:
  nginx_proxy:
    image: nginx:alpine
    container_name: storex-nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user_service
      - product_service
    networks:
      - storex-net

  user_service:
    image: hashicorp/http-echo:latest
    container_name: storex-user-service
    command: ["-listen=:8081", "-text=User Service is Operational!"]
    # Không mở port out ra host, chỉ lắng nghe nội bộ 8081
    networks:
      - storex-net

  product_service:
    image: hashicorp/http-echo:latest
    container_name: storex-product-service
    command: ["-listen=:8082", "-text=Product Service is Operational!"]
    # Không mở port out ra host, chỉ lắng nghe nội bộ 8082
    networks:
      - storex-net

networks:
  storex-net:
    driver: bridge