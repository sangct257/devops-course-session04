server {
    listen 80;

    location /users/ {
        # Đã sửa 'localhost' thành tên service 'user_service'
        # Dấu slash '/' ở cuối proxy_pass giúp rewrite/strip prefix /users/ khi forward vào backend
        proxy_pass http://user_service:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /products/ {
        # Đã sửa 'localhost' thành tên service 'product_service'
        proxy_pass http://product_service:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}