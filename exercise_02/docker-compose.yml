services:
  backend:
    image: postgres:13
    container_name: storex-backend
    command: >
      sh -c "apt-get update && apt-get install -y redis-tools &&
             echo 'Checking Database & Redis connection...' &&
             pg_isready -h postgres -p 5432 -U admin -d storex_db &&
             redis-cli -h redis ping &&
             echo 'SUCCESS: Backend started after Postgres and Redis are HEALTHY!'"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:13
    container_name: storex-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=storex_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
    volumes:
      - storex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d storex_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:alpine
    container_name: storex-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  storex_pgdata: